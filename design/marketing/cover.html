<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cover</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .stage { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 400px; align-items: center; padding: 0 150px 0 150px; gap: 80px; }
    .icon { width: 168px; height: 168px; border-radius: 22.37%; display: block; margin-bottom: 56px;
      box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.10); }
    h1 { margin-bottom: 32px; font-size: 128px; letter-spacing: -0.04em; }
    .lede { max-width: 900px; }
    .points { display: flex; gap: 12px; margin-top: 56px; }
    .point { display: inline-flex; align-items: center; gap: 12px; padding: 13px 20px; border-radius: 999px; white-space: nowrap; background: #fff;
      box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.04); font-size: 21px; font-weight: 500; letter-spacing: -0.01em; }
    .point i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
    .point code { font-size: 19px; color: var(--ink); }
    .ui { justify-self: end; transform: scale(1.24); transform-origin: right center; }
  </style>
</head>
<body>
  <div class="stage">
    <div>
      <img class="icon" src="../logo/kit/final/glass/icon-glass.svg" alt="" />
      <h1>Tokens to Code</h1>
      <p class="lede"><b>Export your Figma variables</b> as CSS custom properties and a ready&#8209;to&#8209;use Tailwind theme.</p>
      <div class="points">
        <span class="point"><i style="background:var(--blue)"></i>Every mode as <code>[data-theme]</code></span>
        <span class="point"><i style="background:var(--orange)"></i>Aliases kept as <code>var()</code></span>
        <span class="point"><i style="background:var(--red)"></i>Your Code Syntax names</span>
      </div>
    </div>
    <div class="ui window">
      <div class="window-bar"><img src="../logo/kit/final/glass/icon-glass.svg" alt="" />Tokens to Code<span class="x">✕</span></div>
      <iframe src="harness.html?theme=light&amp;sel=C1,C2:l%2Bd,C3&amp;run=1&amp;scroll=%2F*%20---%20Collection%3A%20Theme%20%7C%20Mode%3A%20Dark" title="Plugin"></iframe>
    </div>
  </div>
</body>
</html>
